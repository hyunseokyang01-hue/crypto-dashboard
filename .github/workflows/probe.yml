name: probe
on:
  push:
    branches: ['tmp/funding-probe']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          p() { echo "=== $1"; curl -sS -m 15 -o /tmp/o -w "HTTP %{http_code}\n" "$2" || true; head -c 600 /tmp/o; echo; }
          p okx-btc "https://www.okx.com/api/v5/public/funding-rate?instId=BTC-USDT-SWAP"
          p okx-eth "https://www.okx.com/api/v5/public/funding-rate?instId=ETH-USDT-SWAP"
          p bybit "https://api.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT"
          p deribit "https://www.deribit.com/api/v2/public/ticker?instrument_name=BTC-PERPETUAL"
          p bitmex "https://www.bitmex.com/api/v1/instrument?symbol=XBTUSDT&columns=fundingRate,symbol"
          p binance "https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT"
